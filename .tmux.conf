# # True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ',*:Tc'

set -g allow-passthrough on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh


setw -g mode-keys vi
# Copy selection to system clipboard using OSC52
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux save-buffer - | base64 | tr -d '\n' | awk '{printf \"\033]52;c;%s\007\", $0}'"

# remap prefix
unbind C-b
set-option -g prefix 'C-\'
bind-key 'C-\' send-prefix
unbind C-d

# Make sure tmux allows for osc52
set -g set-clipboard on

# Prefix + v → vertical split
bind v split-window -h -c "#{pane_current_path}"

# Prefix + h → horizontal split
bind s split-window -v -c "#{pane_current_path}"

# # Only use vim-style keys if not in copy mode or Vim
bind -n C-h if-shell "tmux display-message -p '#{pane_current_command}' | grep -iq 'nvim'" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "tmux display-message -p '#{pane_current_command}' | grep -iq 'nvim'" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "tmux display-message -p '#{pane_current_command}' | grep -iq 'nvim'" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "tmux display-message -p '#{pane_current_command}' | grep -iq 'nvim'" "send-keys C-l" "select-pane -R"
# optional: basic pane navigation outside Neovim
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'      # Prefix + Shift-S to save
set -g @resurrect-restore 'R'   # Prefix + Shift-R to restore

# Vim-style pane resizing using Prefix + h/j/k/l
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

